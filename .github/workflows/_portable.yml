{
  "name": "Portable verification",
  "on": {
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "defaults": {
    "run": {
      "shell": "bash",
      "working-directory": "works"
    }
  },
  "jobs": {
    "portable": {
      "name": "${{ matrix.os }} Python ${{ matrix.python }}",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ],
          "python": [
            "3.11",
            "3.12",
            "3.13"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d",
          "with": {
            "version": "0.13.0",
            "python-version": "${{ matrix.python }}",
            "working-directory": "works",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "require-checksums": true
          }
        },
        {
          "run": "uv sync --locked --dev"
        },
        {
          "name": "Lint and requirement map",
          "run": "uv run --locked ruff check src tests scripts\nuv run --locked ruff format --check src tests scripts\nuv run --locked python scripts/report_ci.py --requirements"
        },
        {
          "name": "Portable tests and branch coverage",
          "run": "uv run --locked pytest --junitxml=\"$RUNNER_TEMP/portable.xml\" --cov-report=\"json:$RUNNER_TEMP/coverage.json\""
        },
        {
          "name": "Sanitized test report",
          "if": "always()",
          "run": "uv run --locked python scripts/report_ci.py --junit \"$RUNNER_TEMP/portable.xml\" --coverage \"$RUNNER_TEMP/coverage.json\" --output reports/portable.json"
        },
        {
          "name": "Build and clean-install both distributions",
          "run": "uv build\nuv run --locked python scripts/verify_distribution.py"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "portable-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}",
            "path": "works/reports/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    },
    "workflow-lint": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d",
          "with": {
            "version": "0.13.0",
            "python-version": "3.12",
            "working-directory": "works",
            "enable-cache": true,
            "cache-dependency-glob": "uv.lock",
            "require-checksums": true
          }
        },
        {
          "run": "uv sync --locked --dev\nuv run --locked python scripts/lint_workflows.py"
        }
      ]
    }
  }
}
